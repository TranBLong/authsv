spring.application.name=auths

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=auths;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=12345
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

spring.jpa.properties.hibernate.connection.characterEncoding=UTF-8
spring.jpa.properties.hibernate.connection.useUnicode=true

jwt.secret=ChangeThisSecretKeyForJwtTokenGeneration123456
jwt.expiration-ms=86400000

# Tạm thời tắt bảo mật để test (true/false)
# app.security.enabled=true

